        shell: pwsh
        run: |
          ./dist/sahyacode-windows-x64/bin/sahyacode.exe --version
      
      - name: Package
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path sahyacode-windows-x64 -DestinationPath sahyacode-windows-x64.zip
          Get-ChildItem *.zip
      
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/sahyacode-windows-x64.zip

  create-release:
    needs: [build-macos-arm64, build-linux-x64, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      
      - name: List binaries
        run: ls -la binaries/
      
      - name: Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: SahyaCode ${{ github.event.inputs.version }}
          files: binaries/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
