name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v2.13.8)'
        required: true
        default: 'v2.13.8'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.2
      
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            if command -v apt-get &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y jq
            elif command -v brew &> /dev/null; then
              brew install jq
            fi
          fi
      
      - name: Replace catalog dependencies
        run: |
          # Replace all catalog: references with actual versions
          find packages/sahyacode -name "package.json" -exec sed -i \
            -e 's/"@effect\/platform-node": "catalog:/"@effect\/platform-node": "4.0.0-beta.43/g' \
            -e 's/"@types\/bun": "catalog:/"@types\/bun": "1.3.11/g' \
            -e 's/"@octokit\/rest": "catalog:/"@octokit\/rest": "22.0.0/g' \
            -e 's/"@hono\/zod-validator": "catalog:/"@hono\/zod-validator": "0.4.2/g' \
            -e 's/"ulid": "catalog:/"ulid": "3.0.1/g' \
            -e 's/"@types\/node": "catalog:/"@types\/node": "22.13.9/g' \
            -e 's/"@tsconfig\/bun": "catalog:/"@tsconfig\/bun": "1.0.9/g' \
            -e 's/"@openauthjs\/openauth": "catalog:/"@openauthjs\/openauth": "0.0.0-20250322224806/g' \
            -e 's/"@pierre\/diffs": "catalog:/"@pierre\/diffs": "1.1.0-beta.18/g' \
            -e 's/"diff": "catalog:/"diff": "8.0.2/g' \
            -e 's/"drizzle-kit": "catalog:/"drizzle-kit": "1.0.0-beta.19-d95b7a4/g' \
            -e 's/"drizzle-orm": "catalog:/"drizzle-orm": "1.0.0-beta.19-d95b7a4/g' \
            -e 's/"effect": "catalog:/"effect": "4.0.0-beta.43/g' \
            -e 's/"ai": "catalog:/"ai": "6.0.138/g' \
            -e 's/"hono": "catalog:/"hono": "4.10.7/g' \
            -e 's/"hono-openapi": "catalog:/"hono-openapi": "1.1.2/g' \
            -e 's/"remeda": "catalog:/"remeda": "2.26.0/g' \
            -e 's/"solid-js": "catalog:/"solid-js": "1.9.10/g' \
            -e 's/"typescript": "catalog:/"typescript": "5.8.2/g' \
            -e 's/"@typescript\/native-preview": "catalog:/"@typescript\/native-preview": "7.0.0-dev.20251207.1/g' \
            -e 's/"zod": "catalog:/"zod": "4.1.8/g' \
            -e 's/"@solidjs\/meta": "catalog:/"@solidjs\/meta": "0.29.4/g' \
            -e 's/"@solidjs\/router": "catalog:/"@solidjs\/router": "0.15.4/g' \
            -e 's/"@solidjs\/start": "catalog:/"@solidjs\/start": "https:\/\/pkg.pr.new\/@solidjs\/start@dfb2020/g' \
            -e 's/"@tailwindcss\/vite": "catalog:/"@tailwindcss\/vite": "4.1.11/g' \
            -e 's/"@solid-primitives\/storage": "catalog:/"@solid-primitives\/storage": "4.3.3/g' \
            -e 's/"tailwindcss": "catalog:/"tailwindcss": "4.1.11/g' \
            -e 's/"vite": "catalog:/"vite": "7.1.4/g' \
            -e 's/"@types\/luxon": "catalog:/"@types\/luxon": "3.7.1/g' \
            -e 's/"luxon": "catalog:/"luxon": "3.6.1/g' \
            -e 's/"marked": "catalog:/"marked": "17.0.1/g' \
            -e 's/"marked-shiki": "catalog:/"marked-shiki": "1.2.1/g' \
            -e 's/"shiki": "catalog:/"shiki": "3.20.0/g' \
            -e 's/"virtua": "catalog:/"virtua": "0.42.3/g' \
            -e 's/"@kobalte\/core": "catalog:/"@kobalte\/core": "0.13.11/g' \
            -e 's/"@cloudflare\/workers-types": "catalog:/"@cloudflare\/workers-types": "4.20251008.0/g' \
            -e 's/"fuzzysort": "catalog:/"fuzzysort": "3.1.0/g' \
            -e 's/"solid-list": "catalog:/"solid-list": "0.42.3/g' \
            -e 's/"vite-plugin-solid": "catalog:/"vite-plugin-solid": "2.11.10/g' \
            {} \;
          cat packages/sahyacode/package.json | grep -E '"@types/bun"|"typescript"|"effect"' | head -5
      
      - name: Install dependencies
        run: |
          # Remove packageManager field temporarily to allow pnpm
          jq 'del(.packageManager)' package.json > package.json.tmp && mv package.json.tmp package.json
          pnpm install --no-frozen-lockfile
      
      - name: Build macOS ARM64 binary
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "Building version: $VERSION"
          mkdir -p dist/sahyacode-darwin-arm64/bin
          cd packages/sahyacode
          SAHYACODE_VERSION="$VERSION" SAHYACODE_CHANNEL="latest" bun build --compile --target=bun-darwin-arm64 ./src/index.ts --outfile ../../dist/sahyacode-darwin-arm64/bin/sahyacode
      
      - name: Test binary version
        run: |
          ./dist/sahyacode-darwin-arm64/bin/sahyacode --version
      
      - name: Package
        run: |
          cd dist
          zip -r sahyacode-darwin-arm64.zip sahyacode-darwin-arm64
          ls -la *.zip
      
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/sahyacode-darwin-arm64.zip

